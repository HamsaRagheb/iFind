<!-- MAIN HEADER -->
@if (isLoggedIn$ | async) {
  <header class="main-header my-0 py-2">
    <div class="container">
      <div class="row align-items-center justify-content-between flex-nowrap">
        <!------------------------------ MOBILE --------------------------->
        <!-- MOBILE / TABLET HEADER -->
        <div class="mobile-header d-lg-none my-0 py-0">
          <!-- Top Row -->
          <div
            class="mobile-top d-flex justify-content-between align-items-center p-0"
          >
            <div routerLink="/home" class="logo mx-3">
              <img
                class="img-fluid my-auto"
                src="images/logo.png"
                alt="logo-img"
              />
            </div>

            <div class="mobile-actions">
              <div routerLink="/wishlist" class="action-item position-relative">
                <span class="badge-count">{{ wishlistCount }}</span>
                <i class="fa-solid fa-heart"></i>
              </div>

              <div routerLink="/cart" class="action-item position-relative">
                <span class="badge-count">{{ cartCount }}</span>
                <i class="fa-solid fa-cart-shopping"></i>
              </div>

              <button
                class="menu-btn me-3"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileSidebar"
                aria-label="Toggle Menu"
              >
                <i class="fa-solid fa-bars"></i>
              </button>
            </div>
          </div>

          <!-- Mobile Search -->
          <div class="mobile-search mb-2 mt-0 mx-auto">
            <div class="search-row">
              <input
                #searchInputMobile
                type="text"
                class="form-control search-input"
                [placeholder]="'HEADER.SEARCH_PLACEHOLDER_MOBILE' | translate"
                (input)="onSearch($event)"
                aria-label="Search"
              />
              <button
                (click)="focuseSearchMobile()"
                class="btn search-btn"
                aria-label="Search"
              >
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>
        </div>

        <!------------------------------ DESKTOP --------------------------->
        <!-- DESKTOP: Logo -->
        <div
          routerLink="/home"
          class="logo-div d-none d-lg-flex col-lg-2 align-items-center"
        >
          <img src="images/logo.png" alt="logo-img" />
        </div>

        <!-- DESKTOP: Search -->
        <div class="search col-lg-6 d-none d-lg-block mt-lg-2">
          <div class="search-wrapper d-flex align-items-stretch">
            <select
              (change)="onCategoryChange($event)"
              aria-label="Categories"
              class="form-select category-select"
            >
              <option>{{ "HEADER.ALL_CATEGORIES" | translate }}</option>
              <ng-container *ngFor="let category of categories">
                <option [value]="category.name">{{ category.name }}</option>
              </ng-container>
            </select>

            <div class="d-flex flex-grow-1">
              <input
                #searchInputDesktop
                type="text"
                class="form-control search-input flex-grow-1"
                [placeholder]="'HEADER.SEARCH_PLACEHOLDER' | translate"
                (input)="onSearch($event)"
                aria-label="Search"
              />
              <button
                (click)="focuseSearchDesktop()"
                aria-label="Search"
                class="btn search-btn"
              >
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- DESKTOP: Settings (theme + language + logout) -->
        <div
          class="d-none d-lg-flex col-lg-4 col-xl-3 justify-content-end align-items-center gap-3 mt-lg-2"
        >
          <button (click)="toggleTheme()" class="btn theme-toggle-btn">
            @if (_theme.currentTheme) {
              <i class="fa-solid fa-sun"></i>
            } @else {
              <i class="fa-solid fa-moon"></i>
            }
          </button>

          @if (lang$ | async; as lang) {
            <button class="btn language-btn" (click)="toggleLanguage(lang)">
              <i class="fa-solid fa-globe mx-1"></i>
              {{ lang === "en" ? "العربية" : "English" }}
            </button>
          }

          <div class="action-item" (click)="logout()">
            <i class="fa-solid fa-right-from-bracket"></i>
            <h6>{{ "NAV.LOGOUT" | translate }}</h6>
          </div>
        </div>
      </div>
    </div>
  </header>
} @else {
  <header class="main-header py-2">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <div routerLink="/home" class="logo-div">
          <img src="images/logo.png" alt="logo-img" />
        </div>

        <div class="d-flex align-items-center gap-3">
          <button (click)="toggleTheme()" class="btn theme-toggle-btn">
            @if (_theme.currentTheme) {
              <i class="fa-solid fa-sun"></i>
            } @else {
              <i class="fa-solid fa-moon"></i>
            }
          </button>

          @if (lang$ | async; as lang) {
            <button class="btn language-btn" (click)="toggleLanguage(lang)">
              <i class="fa-solid fa-globe mx-1"></i>
              {{ lang === "en" ? "العربية" : "English" }}
            </button>
          }
        </div>
      </div>
    </div>
  </header>
}
